version: 2

models:
  - name: daily_payment_summary
    description: Daily payment metrics grouped by country and transaction type.

    columns:
      - name: event_date
        description: Business date on which the payment event occurred.
        data_tests:
          - not_null

      - name: country_code
        description: Country associated with the player.
        data_tests:
          - not_null

      - name: transaction_type
        description: Deposit or withdrawal.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['DEPOSIT', 'WITHDRAWAL']

      - name: transaction_count
        description: Number of payment transactions in the group.
        data_tests:
          - not_null

      - name: total_amount
        description: Total payment amount for the group.
        data_tests:
          - not_null