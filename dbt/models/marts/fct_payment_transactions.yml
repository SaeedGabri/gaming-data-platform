version: 2

models:
  - name: fct_payment_transactions
    description: Incrementally maintained payment transaction fact table.

    columns:
      - name: transaction_id
        description: Unique identifier for each payment transaction.
        data_tests:
          - not_null
          - unique

      - name: player_id
        data_tests:
          - not_null

      - name: event_date
        data_tests:
          - not_null

      - name: ingestion_timestamp
        data_tests:
          - not_null